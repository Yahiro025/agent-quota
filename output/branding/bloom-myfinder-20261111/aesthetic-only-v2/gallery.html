<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloom — aesthetic moodboards</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif)}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}h2{font-size:16px;line-height:1.4;font-weight:600;margin:0 0 10px}h2 span{color:var(--muted-foreground);font-size:12px;font-weight:400;display:block;margin-top:3px}.board{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:var(--radius,8px);overflow:hidden}.board img{display:block;width:100%;height:auto}.board:focus-visible,.close:focus-visible{outline:3px solid var(--ring);outline-offset:4px}.board:hover img{opacity:.93}dialog{max-width:calc(100% - 16px);width:1400px;max-height:95%;padding:12px;border:1px solid var(--border);border-radius:var(--radius,8px);background:var(--popover);color:var(--foreground)}dialog::backdrop{background:rgba(0,0,0,.8)}dialog img{display:block;width:100%;height:auto}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}.close{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius,6px);padding:10px 16px;min-height:44px;cursor:pointer}@media(max-width:559px){.boards{grid-template-columns:1fr}}
</style></head><body><main class="boards"><section><h2>1. Quiet Instrument<span>Precise · Discreet · Composed</span></h2><button class="board" type="button" aria-label="Enlarge Quiet Instrument" data-name="Quiet Instrument"><img src="C:/Users/Bennett/Documents/PROJECT/agent-quota/output/branding/bloom-myfinder-20261111/aesthetic-only-v2/01-quiet-instrument.png" alt="Quiet Instrument Bloom aesthetic moodboard with nine distinct editorial images and no product interface"></button></section><section><h2>2. Warm Companion<span>Reassuring · Tactile · Human</span></h2><button class="board" type="button" aria-label="Enlarge Warm Companion" data-name="Warm Companion"><img src="C:/Users/Bennett/Documents/PROJECT/agent-quota/output/branding/bloom-myfinder-20261111/aesthetic-only-v2/02-warm-companion.png" alt="Warm Companion Bloom aesthetic moodboard with nine distinct editorial images and no product interface"></button></section><section><h2>3. Living Rhythm<span>Fresh · Balanced · Restorative</span></h2><button class="board" type="button" aria-label="Enlarge Living Rhythm" data-name="Living Rhythm"><img src="C:/Users/Bennett/Documents/PROJECT/agent-quota/output/branding/bloom-myfinder-20261111/aesthetic-only-v2/03-living-rhythm.png" alt="Living Rhythm Bloom aesthetic moodboard with nine distinct editorial images and no product interface"></button></section><section><h2>4. After Hours<span>Focused · Atmospheric · Assured</span></h2><button class="board" type="button" aria-label="Enlarge After Hours" data-name="After Hours"><img src="C:/Users/Bennett/Documents/PROJECT/agent-quota/output/branding/bloom-myfinder-20261111/aesthetic-only-v2/04-after-hours.png" alt="After Hours Bloom aesthetic moodboard with nine distinct editorial images and no product interface"></button></section></main><dialog><div class="dialog-head"><strong id="dialogTitle"></strong><button type="button" class="close">Close</button></div><img id="enlarged" alt=""></dialog><script>
const dialog=document.querySelector('dialog');document.querySelectorAll('.board').forEach(button=>button.addEventListener('click',()=>{const img=button.querySelector('img');document.getElementById('enlarged').src=img.src;document.getElementById('enlarged').alt=img.alt;document.getElementById('dialogTitle').textContent=button.dataset.name;dialog.showModal()}));document.querySelector('.close').addEventListener('click',()=>dialog.close());
</script></body></html>
